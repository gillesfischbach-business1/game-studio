<!doctype html><html><head><meta charset="utf-8"><title>Export-Vorschau</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>html,body{margin:0;background:#111}</style></head><body>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'; import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color('#9fb6cc'); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment()).texture;
s.add(new THREE.HemisphereLight('#fff', '#444', 1.2)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(100, 200, 80); s.add(d);
const c = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 3000); c.position.set(170, 150, 170); c.lookAt(-20, 0, 10);
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('../exports/schueberfouer_world.glb', g => { s.add(g.scene); r.render(s, c); window.done = g.scene.children.length; }, undefined, e => { window.done = 'ERR ' + e.message; });
</script></body></html>
